name: Inka Images

# Builds the production images for the inka.kitchenasty.com stack.
# Deployment is pull-based: bump the image tags in orca-infra
# services/personal/service.toml and `orca redeploy` on the master.

on:
  push:
    tags:
      - 'inka-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mighty840/kitchenasty

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - package: server
            context: .
            dockerfile: packages/server/Dockerfile
            build-args: ""
          - package: admin
            context: .
            dockerfile: packages/admin/Dockerfile
            build-args: "VITE_BASE_PATH=/admin/"
          - package: storefront
            context: .
            dockerfile: packages/storefront/Dockerfile
            build-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.package }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha,scope=inka-${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=inka-${{ matrix.package }}
